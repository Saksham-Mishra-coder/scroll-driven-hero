<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ITZFIZZ — Scroll-Driven Vehicle Experience</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="style.css" />
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
</head>
<body>

  <section class="section" id="heroSection">
    <div class="track" id="heroTrack">
      <div class="road" id="road">
        <img
          src="assets/car.png"
          alt="Top-view Sports Car"
          class="car"
          id="car"
          loading="eager"
        />
        <div class="trail" id="trail"></div>
        <div class="value-add" id="valueText" aria-label="WELCOME ITZFIZZ">
          <span class="value-letter">W</span>
          <span class="value-letter">E</span>
          <span class="value-letter">L</span>
          <span class="value-letter">C</span>
          <span class="value-letter">O</span>
          <span class="value-letter">M</span>
          <span class="value-letter">E</span>
          <span class="value-letter space-char">&nbsp;</span>
          <span class="value-letter">I</span>
          <span class="value-letter">T</span>
          <span class="value-letter">Z</span>
          <span class="value-letter">F</span>
          <span class="value-letter">I</span>
          <span class="value-letter">Z</span>
          <span class="value-letter">Z</span>
        </div>
      </div>

      <div class="text-box" id="box1">
        <span class="num-box">58%</span>
        <span class="text-desc">Increase in pick up point use</span>
      </div>

      <div class="text-box" id="box2">
        <span class="num-box">23%</span>
        <span class="text-desc">Decreased in customer phone calls</span>
      </div>

      <div class="text-box" id="box3">
        <span class="num-box">27%</span>
        <span class="text-desc">Increase in pick up point use</span>
      </div>

      <div class="text-box" id="box4">
        <span class="num-box">40%</span>
        <span class="text-desc">Decreased in customer phone calls</span>
      </div>

      <div class="scroll-indicator" id="scrollIndicator">
        <div class="mouse-icon">
          <div class="wheel"></div>
        </div>
        <span>Scroll to drive</span>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
